[project]
name = "options-vol-surface"
version = "0.1.0"
description = "Options pricer, implied-volatility surface, and Greek attribution study"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib==3.10.8",
    "numpy==2.4.1",
    "pandas==3.0.0",
    "pyarrow==23.0.0",
    "scipy==1.17.0",
    "yfinance==1.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff==0.12.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
